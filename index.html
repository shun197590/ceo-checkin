<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>115年度高雄軟體園區CEO聯誼會－連續掃碼報到</title>
 
  <!-- html5-qrcode：GitHub Pages 外部 HTTPS 頁使用相機掃描 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
 
  <style>
    * { box-sizing: border-box; }
 
    body {
      margin: 0;
      padding: 14px;
      background: #f4f6f8;
      color: #222;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
 
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
 
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      line-height: 1.4;
    }
 
    .subtitle {
      color: #666;
      margin-bottom: 14px;
    }
 
    .connection {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-weight: 700;
      background: #fef7e0;
    }
 
    .connection.ok { background: #e6f4ea; }
    .connection.error { background: #fce8e6; }
 
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
 
    .stat {
      background: #fff;
      padding: 12px 5px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      font-size: 13px;
    }
 
    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
    }
 
    .panel {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }
 
    .panel h2 {
      margin: 0 0 10px;
      font-size: 19px;
    }
 
    .hint {
      margin: 0 0 10px;
      color: #666;
      line-height: 1.7;
    }
 
    button,
    select,
    input {
      width: 100%;
      min-height: 48px;
      border-radius: 10px;
      font-size: 16px;
    }
 
    button {
      border: 0;
      background: #1a73e8;
      color: #fff;
      font-weight: 800;
      padding: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
 
    button.secondary { background: #5f6368; }
    button.success { background: #188038; }
    button.warning { background: #b06000; }
    button:disabled { opacity: .5; cursor: default; }
 
    input,
    select {
      border: 1px solid #aaa;
      background: #fff;
      padding: 10px 12px;
      margin-top: 8px;
    }
 
    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      min-height: 260px;
    }
 
    #reader video {
      border-radius: 12px;
    }
 
    .scan-status {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: #eef3fd;
      line-height: 1.6;
      word-break: break-word;
    }
 
    .result {
      display: none;
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 14px;
      text-align: center;
    }
 
    .result.success-result {
      display: block;
      background: #e6f4ea;
      border: 2px solid #34a853;
    }
 
    .result.warning-result {
      display: block;
      background: #fef7e0;
      border: 2px solid #f9ab00;
    }
 
    .result.error-result {
      display: block;
      background: #fce8e6;
      border: 2px solid #d93025;
    }
 
    .result-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
    }
 
    .badge-card {
      background: #fff;
      border: 4px solid #1a73e8;
      border-radius: 18px;
      padding: 14px;
      margin: 12px 0 16px;
    }
 
    .badge-label {
      font-size: 19px;
      font-weight: 800;
      color: #555;
    }
 
    .badge-number {
      font-size: clamp(72px, 24vw, 130px);
      line-height: 1;
      color: #1a73e8;
      font-weight: 1000;
      letter-spacing: 5px;
      margin: 8px 0;
    }
 
    .person {
      line-height: 1.8;
      font-size: 17px;
      text-align: left;
    }
 
    .person-name {
      font-size: 22px;
      font-weight: 900;
    }
 
    .search-item {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }
 
    .search-item:last-child { border-bottom: 0; }
 
    .company {
      font-weight: 800;
      font-size: 17px;
    }
 
    .detail {
      color: #555;
      line-height: 1.6;
      margin-top: 3px;
    }
 
    .mini-btn {
      width: auto;
      min-height: 40px;
      padding: 8px 16px;
      font-size: 15px;
    }
 
    .already {
      margin-top: 7px;
      color: #b06000;
      font-weight: 800;
    }
 
    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 8px 0 18px;
    }
 
    @media (max-width: 520px) {
      .dashboard { grid-template-columns: repeat(2, 1fr); }
      h1 { font-size: 21px; }
    }
  </style>
</head>
 
<body>
<div class="container">
  <h1>115年度高雄軟體園區CEO聯誼會</h1>
  <div class="subtitle">GitHub Pages－同一頁連續相機掃碼報到</div>
 
  <div id="connection" class="connection">正在連線 Apps Script 控制頁…</div>
 
  <div class="dashboard">
    <div class="stat">正式報名<strong id="registered">-</strong></div>
    <div class="stat">已報到<strong id="checkedIn">-</strong></div>
    <div class="stat">未報到<strong id="notCheckedIn">-</strong></div>
    <div class="stat">報到率<strong id="rate">-</strong></div>
  </div>
 
  <div id="result" class="result"></div>
 
  <div class="panel">
    <h2>📷 連續掃碼＋🔊 中文語音</h2>
    <p class="hint">活動開始前按一次「啟用相機＋測試語音」。相機會持續開啟；每次完成報到後會自動回到掃描狀態。</p>
 
    <label for="voiceSelect"><strong>中文語音（請選您覺得最清楚的女聲）</strong></label>
    <select id="voiceSelect"></select>
 
    <button id="startBtn" onclick="startSystem()" disabled>📷 啟用相機＋🔊 測試報到語音</button>
    <button id="stopBtn" class="secondary" onclick="stopScanner()" disabled>停止相機</button>
 
    <div id="reader"></div>
    <div id="scanStatus" class="scan-status">等待控制頁連線。</div>
  </div>
 
  <div class="panel">
    <h2>⌨️ 手動輸入報到碼</h2>
    <input id="codeInput" type="text" autocomplete="off" placeholder="例如 CEO2026-0002-...">
    <button onclick="manualCheckin()">確認報到</button>
  </div>
 
  <div class="panel">
    <h2>🔎 姓名／公司搜尋</h2>
    <input id="keyword" type="text" autocomplete="off" placeholder="輸入公司名稱或姓名"
      onkeydown="if(event.key==='Enter'){searchParticipant();}">
    <button onclick="searchParticipant()">搜尋</button>
    <div id="searchResults"></div>
  </div>
 
  <div class="footer">經濟部產業園區管理局｜高雄軟體園區辦公室</div>
</div>
 
<script>
  // ==========================================================
  // 與 Apps Script 控制頁連線資訊
  // 這些參數由控制頁「啟動連續掃碼器」時自動帶入。
  // 因此請勿直接從書籤開 GitHub Scanner。
  // ==========================================================
  const params = new URLSearchParams(window.location.search);
  const CONTROL_ORIGIN = String(params.get('controlOrigin') || '').trim();
  const SESSION_TOKEN = String(params.get('sessionToken') || '').trim();
 
  let controlConnected = false;
  let lastPongAt = 0;
  let helloTimer = null;
  let heartbeatTimer = null;
 
  // ==========================================================
  // Scanner 狀態
  // ==========================================================
  let html5QrCode = null;
  let scannerStarted = false;
  let scannerPaused = false;
  let requestBusy = false;
  let currentRequestId = '';
  let requestTimer = null;
  let lastScannedCode = '';
  let lastScannedAt = 0;
  const REQUEST_TIMEOUT_MS = 30000;
  const DUPLICATE_SUPPRESS_MS = 7000;
  const AUTO_RESUME_MS = 2600;
 
  // ==========================================================
  // 語音狀態
  // ==========================================================
  let checkinVoiceEnabled = false;
  let speechVoices = [];
  let lastResultForReplay = null;
 
 
  // ==========================================================
  // 初始化
  // ==========================================================
  window.addEventListener('load', function(){
    loadVoices();
    validateLaunchContext();
  });
 
 
  function validateLaunchContext(){
    if (!window.opener || window.opener.closed || !CONTROL_ORIGIN || !SESSION_TOKEN) {
      setConnection(
        '此掃碼頁必須從 Apps Script 控制頁按「啟動連續掃碼器」開啟。請關閉本頁，回控制頁重新啟動。',
        'error'
      );
      setScanStatus('未連線控制頁，無法報到。');
      return;
    }
 
    sendHello();
    helloTimer = setInterval(sendHello, 1800);
    heartbeatTimer = setInterval(sendPing, 10000);
  }
 
 
  function sendToControl(message){
    if (!window.opener || window.opener.closed) {
      controlConnected = false;
      setConnection('Apps Script 控制頁已關閉，請重新從控制頁啟動掃碼器。', 'error');
      document.getElementById('startBtn').disabled = true;
      return false;
    }
 
    const payload = Object.assign({}, message, {
      source: 'CEO_SCANNER',
      sessionToken: SESSION_TOKEN
    });
 
    window.opener.postMessage(payload, CONTROL_ORIGIN);
    return true;
  }
 
 
  function sendHello(){
    sendToControl({type:'HELLO'});
  }
 
 
  function sendPing(){
    if (!controlConnected) return;
    sendToControl({type:'PING', ts:Date.now()});
 
    if (lastPongAt && Date.now() - lastPongAt > 30000) {
      controlConnected = false;
      setConnection('控制頁連線中斷，請確認 Apps Script 控制頁仍保持開啟。', 'error');
      document.getElementById('startBtn').disabled = true;
    }
  }
 
 
  window.addEventListener('message', function(event){
    if (!window.opener || event.source !== window.opener) return;
    if (CONTROL_ORIGIN && event.origin !== CONTROL_ORIGIN) return;
 
    const data = event.data || {};
    if (data.source !== 'CEO_CONTROL') return;
    if (data.sessionToken !== SESSION_TOKEN) return;
 
    if (data.type === 'HELLO_ACK') {
      controlConnected = true;
      lastPongAt = Date.now();
      if (helloTimer) {
        clearInterval(helloTimer);
        helloTimer = null;
      }
      setConnection('✅ Apps Script 控制頁已連線，可開始報到。', 'ok');
      document.getElementById('startBtn').disabled = false;
      setScanStatus('控制頁已連線。請按「啟用相機＋測試報到語音」。');
      requestDashboard();
      return;
    }
 
    if (data.type === 'PONG') {
      lastPongAt = Date.now();
      return;
    }
 
    if (data.type === 'DASHBOARD_RESULT') {
      updateDashboard(data.payload || {});
      return;
    }
 
    if (data.type === 'CHECKIN_RESULT') {
      if (!currentRequestId || data.requestId !== currentRequestId) return;
      finishRequest();
      handleCheckinResult(data.payload || {});
      return;
    }
 
    if (data.type === 'SEARCH_RESULT') {
      if (!currentRequestId || data.requestId !== currentRequestId) return;
      finishRequest(false);
      if (data.errorMessage) {
        showResult({type:'error',message:'搜尋失敗：' + data.errorMessage});
      } else {
        renderSearchResults(data.payload || []);
      }
    }
  });
 
 
  function setConnection(text, type){
    const el = document.getElementById('connection');
    el.textContent = text;
    el.className = 'connection ' + (type || '');
  }
 
 
  // ==========================================================
  // 相機啟動／停止／暫停／恢復
  // ==========================================================
  async function startSystem(){
    if (!controlConnected) {
      showResult({type:'error',message:'尚未連線 Apps Script 控制頁。'});
      return;
    }
 
    if (typeof Html5Qrcode === 'undefined') {
      showResult({type:'error',message:'掃碼函式庫載入失敗，請確認網路連線後重新整理頁面。'});
      return;
    }
 
    unlockVoice();
 
    try {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode('reader');
      }
 
      if (scannerStarted) {
        setScanStatus('相機已啟用，可直接掃描下一位。');
        return;
      }
 
      setScanStatus('正在啟動手機後鏡頭…');
 
      await html5QrCode.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: function(viewfinderWidth, viewfinderHeight){
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            const size = Math.floor(minEdge * 0.72);
            return {width:size, height:size};
          },
          aspectRatio: 1.333334
        },
        onScanSuccess,
        function(){ /* 忽略逐幀未辨識訊息 */ }
      );
 
      scannerStarted = true;
      scannerPaused = false;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      setScanStatus('📷 相機已啟用。請將來賓 QR Code 對準框內。');
 
    } catch (error) {
      scannerStarted = false;
      scannerPaused = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      showResult({
        type:'error',
        message:'無法開啟相機：' + (error && error.message ? error.message : String(error))
      });
      setScanStatus('若使用 iPhone，請確認 Safari 已允許此 GitHub Pages 網站使用相機。');
    }
  }
 
 
  async function stopScanner(){
    if (!html5QrCode || !scannerStarted) return;
 
    try {
      await html5QrCode.stop();
    } catch (e) {
      console.warn(e);
    }
 
    scannerStarted = false;
    scannerPaused = false;
    document.getElementById('startBtn').disabled = !controlConnected;
    document.getElementById('stopBtn').disabled = true;
    setScanStatus('相機已停止。');
  }
 
 
  function pauseScanner(){
    if (!html5QrCode || !scannerStarted || scannerPaused) return;
    try {
      html5QrCode.pause(true);
      scannerPaused = true;
    } catch (e) {
      console.warn('pause failed', e);
    }
  }
 
 
  function resumeScanner(){
    if (!html5QrCode || !scannerStarted || !scannerPaused) return;
    try {
      html5QrCode.resume();
      scannerPaused = false;
      setScanStatus('📷 請掃描下一位來賓 QR Code。');
    } catch (e) {
      console.warn('resume failed', e);
    }
  }
 
 
  function onScanSuccess(decodedText){
    const code = normalizeScannedCode(decodedText);
    if (!code || requestBusy) return;
 
    const now = Date.now();
    if (code === lastScannedCode && now - lastScannedAt < DUPLICATE_SUPPRESS_MS) {
      return;
    }
 
    lastScannedCode = code;
    lastScannedAt = now;
    submitCode(code);
  }
 
 
  function normalizeScannedCode(value){
    let text = String(value || '').trim();
 
    try {
      const url = new URL(text);
      const queryCode = url.searchParams.get('code');
      if (queryCode) text = queryCode;
    } catch (e) {
      // 純報到碼不是網址，直接往下處理。
    }
 
    const match = text.match(/CEO2026-[A-Z0-9-]+/i);
    if (match) text = match[0];
 
    return text
      .normalize('NFKC')
      .replace(/\s+/g, '')
      .trim()
      .toUpperCase();
  }
 
 
  // ==========================================================
  // 報到請求：只傳給 Apps Script 控制頁，不直接呼叫後端。
  // ==========================================================
  function randomRequestId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'R-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  }
 
 
  function submitCode(rawCode){
    const code = normalizeScannedCode(rawCode);
 
    if (!code) {
      showResult({type:'error',message:'報到碼為空白。'});
      return;
    }
 
    if (!controlConnected) {
      showResult({type:'error',message:'Apps Script 控制頁目前未連線。'});
      return;
    }
 
    if (requestBusy) return;
 
    requestBusy = true;
    currentRequestId = randomRequestId();
    pauseScanner();
    setScanStatus('正在確認報到資料：' + code);
 
    sendToControl({
      type:'CHECKIN_REQUEST',
      requestId:currentRequestId,
      code:code
    });
 
    requestTimer = setTimeout(function(){
      if (!requestBusy) return;
      requestBusy = false;
      currentRequestId = '';
      showResult({
        type:'error',
        message:'Apps Script 控制頁未在30秒內回應。請確認控制頁仍保持開啟，再重新掃描。'
      });
      setScanStatus('控制頁回應逾時。');
      setTimeout(resumeScanner, 1000);
    }, REQUEST_TIMEOUT_MS);
  }
 
 
  function manualCheckin(){
    const code = document.getElementById('codeInput').value.trim();
    submitCode(code);
  }
 
 
  function finishRequest(shouldResume){
    if (requestTimer) {
      clearTimeout(requestTimer);
      requestTimer = null;
    }
    requestBusy = false;
    currentRequestId = '';
 
    if (shouldResume !== false) {
      setTimeout(resumeScanner, AUTO_RESUME_MS);
    }
  }
 
 
  // ==========================================================
  // 報到結果：大字名牌＋姓名語音
  // ==========================================================
  function handleCheckinResult(result){
    lastResultForReplay = result || null;
    showResult(result || {});
    requestDashboard();
 
    if (result && result.type === 'success' && result.name && result.badgeNumber) {
      setTimeout(function(){
        speakCheckinSuccess(result.name, result.badgeNumber);
      }, 180);
    }
  }
 
 
  function showResult(result){
    const box = document.getElementById('result');
    const type = result.type || 'error';
 
    let cssClass = 'error-result';
    let icon = '❌';
 
    if (type === 'success') {
      cssClass = 'success-result';
      icon = '✅';
    } else if (type === 'warning') {
      cssClass = 'warning-result';
      icon = '⚠️';
    }
 
    let html = '<div class="result-title">' + icon + ' ' + escapeHtml(result.message || '') + '</div>';
 
    if (result.badgeNumber) {
      html +=
        '<div class="badge-card">' +
          '<div class="badge-label">請領取名牌編號</div>' +
          '<div class="badge-number">' + escapeHtml(result.badgeNumber) + '</div>' +
        '</div>';
    }
 
    if (result.name) {
      html +=
        '<div class="person">' +
          '<div class="person-name">' + escapeHtml(result.name) + '　' + escapeHtml(result.title || '') + '</div>' +
          '<strong>' + escapeHtml(result.company || '') + '</strong><br>' +
          '餐食：' + escapeHtml(result.meal || '') + '<br>' +
          (result.checkinTime ? '報到時間：' + escapeHtml(result.checkinTime) : '') +
        '</div>';
 
      if (result.badgeNumber) {
        html += '<button class="success" onclick="replayLastVoice()">🔊 再播一次姓名＋名牌號碼</button>';
      }
    }
 
    box.className = 'result ' + cssClass;
    box.innerHTML = html;
    box.style.display = 'block';
    window.scrollTo({top:0,behavior:'smooth'});
  }
 
 
  function replayLastVoice(){
    if (!lastResultForReplay || !lastResultForReplay.name || !lastResultForReplay.badgeNumber) return;
    speakCheckinSuccess(lastResultForReplay.name, lastResultForReplay.badgeNumber);
  }
 
 
  // ==========================================================
  // 中文語音
  // ==========================================================
  function loadVoices(){
    if (!('speechSynthesis' in window)) return;
 
    speechVoices = window.speechSynthesis.getVoices() || [];
    const select = document.getElementById('voiceSelect');
    select.innerHTML = '';
 
    const chinese = speechVoices.filter(function(voice){
      return String(voice.lang || '').toLowerCase().startsWith('zh');
    });
 
    const list = chinese.length ? chinese : speechVoices;
 
    list.forEach(function(voice, index){
      const option = document.createElement('option');
      option.value = voice.name;
      option.textContent = voice.name + '（' + voice.lang + '）';
      select.appendChild(option);
    });
 
    // 優先台灣中文，再嘗試名稱中常見女聲關鍵字。
    let preferred = list.find(function(v){
      return String(v.lang || '').toLowerCase().replace('_','-').startsWith('zh-tw');
    });
 
    const femaleKeywords = ['female','mei','ting','hsiao','xiaoxiao','美','婷','曉'];
    for (const keyword of femaleKeywords) {
      const found = list.find(function(v){
        return String(v.name || '').toLowerCase().includes(keyword.toLowerCase());
      });
      if (found) {
        preferred = found;
        break;
      }
    }
 
    if (preferred) select.value = preferred.name;
  }
 
 
  if ('speechSynthesis' in window) {
    window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
  }
 
 
  function unlockVoice(){
    if (!('speechSynthesis' in window)) {
      showResult({type:'warning',message:'此瀏覽器不支援語音播報。'});
      return;
    }
 
    checkinVoiceEnabled = true;
    speakText('報到系統已啟用');
  }
 
 
  function getSelectedVoice(){
    const selectedName = document.getElementById('voiceSelect').value;
    return speechVoices.find(function(v){ return v.name === selectedName; }) || null;
  }
 
 
  function speakText(text){
    if (!checkinVoiceEnabled || !('speechSynthesis' in window)) return;
 
    window.speechSynthesis.cancel();
 
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-TW';
    utterance.volume = 1.0;
    utterance.rate = 0.88;
    utterance.pitch = 1.10;
 
    const voice = getSelectedVoice();
    if (voice) utterance.voice = voice;
 
    window.speechSynthesis.speak(utterance);
  }
 
 
  function badgeNumberToChinese(badgeNumber){
    const number = parseInt(String(badgeNumber || '').replace(/\D/g,''), 10);
    if (isNaN(number)) return String(badgeNumber || '');
 
    const digits = ['零','一','二','三','四','五','六','七','八','九'];
 
    if (number < 10) return digits[number];
    if (number === 10) return '十';
    if (number < 20) return '十' + (number % 10 === 0 ? '' : digits[number % 10]);
    if (number < 100) {
      const tens = Math.floor(number / 10);
      const ones = number % 10;
      return digits[tens] + '十' + (ones === 0 ? '' : digits[ones]);
    }
    return String(number);
  }
 
 
  function speakCheckinSuccess(name, badgeNumber){
    const safeName = String(name || '').trim();
    const chineseBadge = badgeNumberToChinese(badgeNumber);
 
    const text = safeName
      ? safeName + '您好，報到成功，請領取' + chineseBadge + '號名牌。'
      : '報到成功，請領取' + chineseBadge + '號名牌。';
 
    speakText(text);
  }
 
 
  // ==========================================================
  // Dashboard
  // ==========================================================
  function requestDashboard(){
    if (!controlConnected) return;
    sendToControl({
      type:'DASHBOARD_REQUEST',
      requestId:randomRequestId()
    });
  }
 
 
  function updateDashboard(data){
    if (!data || data.error) return;
    document.getElementById('registered').textContent = data.registered;
    document.getElementById('checkedIn').textContent = data.checkedIn;
    document.getElementById('notCheckedIn').textContent = data.notCheckedIn;
    document.getElementById('rate').textContent = data.rate + '%';
  }
 
 
  // ==========================================================
  // 姓名／公司搜尋
  // ==========================================================
  function searchParticipant(){
    const keyword = document.getElementById('keyword').value.trim();
    if (!keyword) {
      showResult({type:'error',message:'請輸入公司名稱或姓名。'});
      return;
    }
 
    if (!controlConnected || requestBusy) return;
 
    requestBusy = true;
    currentRequestId = randomRequestId();
 
    sendToControl({
      type:'SEARCH_REQUEST',
      requestId:currentRequestId,
      keyword:keyword
    });
 
    requestTimer = setTimeout(function(){
      if (!requestBusy) return;
      requestBusy = false;
      currentRequestId = '';
      showResult({type:'error',message:'搜尋逾時，請確認 Apps Script 控制頁仍保持開啟。'});
    }, REQUEST_TIMEOUT_MS);
  }
 
 
  function renderSearchResults(results){
    const box = document.getElementById('searchResults');
    box.innerHTML = '';
 
    if (!results || results.length === 0) {
      box.innerHTML = '<p>查無符合資料。</p>';
      return;
    }
 
    results.forEach(function(item){
      const div = document.createElement('div');
      div.className = 'search-item';
 
      let action = '';
      if (item.registrationStatus !== '報名成功') {
        action = '<div class="already">不可報到：' + escapeHtml(item.registrationStatus || '狀態不明') + '</div>';
      } else if (item.checkinStatus === '已報到') {
        action = '<div class="already">已報到：' + escapeHtml(item.checkinTime || '') + '｜名牌 ' + escapeHtml(item.badgeNumber || '') + '</div>';
      } else {
        action = '<button class="mini-btn" onclick="checkinRow(' + Number(item.row) + ')">確認報到</button>';
      }
 
      div.innerHTML =
        '<div class="company">' + escapeHtml(item.company || '') + '</div>' +
        '<div class="detail">' +
          escapeHtml(item.name || '') + '｜' + escapeHtml(item.title || '') + '<br>' +
          '名牌：' + escapeHtml(item.badgeNumber || '') + '｜餐食：' + escapeHtml(item.meal || '') +
        '</div>' + action;
 
      box.appendChild(div);
    });
  }
 
 
  function checkinRow(row){
    if (!controlConnected || requestBusy) return;
 
    requestBusy = true;
    currentRequestId = randomRequestId();
    pauseScanner();
 
    sendToControl({
      type:'ROW_CHECKIN_REQUEST',
      requestId:currentRequestId,
      row:Number(row)
    });
 
    requestTimer = setTimeout(function(){
      if (!requestBusy) return;
      requestBusy = false;
      currentRequestId = '';
      showResult({type:'error',message:'人工報到逾時，請確認 Apps Script 控制頁仍保持開啟。'});
      setTimeout(resumeScanner, 1000);
    }, REQUEST_TIMEOUT_MS);
  }
 
 
  function setScanStatus(text){
    document.getElementById('scanStatus').textContent = text;
  }
 
 
  function escapeHtml(text){
    return String(text || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }
</script>
