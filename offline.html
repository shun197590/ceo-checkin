<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#59b9c2">
  <title>CEO報到｜目前離線</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f6f8;
      color: #222;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .card {
      max-width: 560px;
      margin: 60px auto;
      padding: 28px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      text-align: center;
    }

    h1 {
      color: #135f68;
      font-size: 24px;
    }

    p {
      line-height: 1.8;
      color: #555;
    }

    button {
      width: 100%;
      min-height: 52px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #0f7f86;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>目前沒有網路連線</h1>
    <p>
      CEO 報到系統需要連線到 Google Apps Script 與 Google Sheets
      才能完成正式報到。
    </p>
    <p>請確認 Wi-Fi 或行動網路恢復後，再重新開啟系統。</p>
    <button type="button" onclick="location.reload()">重新連線</button>
  </div>
</body>
</html>
