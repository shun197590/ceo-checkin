<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CEO 聯誼會報到｜工作人員入口</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#59b9c2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CEO報到">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #f4f6f8;
      color: #222;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 25px; line-height: 1.45; }
    .sub { color: #666; line-height: 1.7; }
    .status {
      margin: 18px 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: #eef3fd;
      font-weight: 700;
    }
    .status.online { background: #e6f4ea; color: #137333; }
    .status.offline { background: #fce8e6; color: #b3261e; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .steps { line-height: 1.9; padding-left: 24px; }
    .note {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #fef7e0;
      line-height: 1.7;
    }
    .footer { color: #777; text-align: center; font-size: 13px; padding: 4px 0 16px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>115年度高雄軟體園區CEO聯誼會</h1>
    <div class="sub">工作人員報到入口 PWA 1.0</div>

    <div id="networkStatus" class="status">正在確認網路狀態…</div>

    <button id="launchButton" onclick="openControlPage()">
      啟動 Apps Script 報到控制頁
    </button>

    <div class="note">
      PWA 只負責快速進入系統，不直接寫入 Google Sheets。<br>
      開啟控制頁後，請再按「測試 Apps Script 後端」及「啟動連續掃碼器」。
    </div>
  </div>

  <div class="card">
    <strong>活動當天操作順序</strong>
    <ol class="steps">
      <li>點手機主畫面的「CEO報到」。</li>
      <li>確認顯示「網路已連線」。</li>
      <li>點「啟動 Apps Script 報到控制頁」。</li>
      <li>在控制頁按「測試 Apps Script 後端」。</li>
      <li>按「啟動連續掃碼器」。</li>
      <li>掃碼頁再按「啟用相機＋測試報到語音」。</li>
    </ol>
  </div>

  <div class="footer">經濟部產業園區管理局｜高雄軟體園區辦公室</div>
</div>

<script>
  // ★ 請把下面網址改成「目前正式部署的 Apps Script /exec 網址」。
  const CONTROL_URL = 'https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbw472sz_13s3Sk5Y4oexnY2sSOUwjQuL44axG4blYIzkvGJmx_CPoiu2K5TgLmIM1SK/exec';

  function updateNetworkStatus() {
    const el = document.getElementById('networkStatus');
    const btn = document.getElementById('launchButton');

    if (navigator.onLine) {
      el.textContent = '● 網路已連線，可以啟動報到系統';
      el.className = 'status online';
      btn.disabled = false;
    } else {
      el.textContent = '● 目前離線：請恢復網路後再進行報到';
      el.className = 'status offline';
      btn.disabled = true;
    }
  }

  function openControlPage() {
    if (!navigator.onLine) {
      alert('目前沒有網路連線，請恢復網路後再啟動報到系統。');
      return;
    }

    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test(CONTROL_URL)) {
      alert('尚未設定正確的 Apps Script /exec 網址。請先修改 pwa/index.html 的 CONTROL_URL。');
      return;
    }

    const opened = window.open(CONTROL_URL, '_blank');
    if (!opened) {
      window.location.href = CONTROL_URL;
    }
  }

  window.addEventListener('online', updateNetworkStatus);
  window.addEventListener('offline', updateNetworkStatus);
  window.addEventListener('load', updateNetworkStatus);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register('./service-worker.js', { updateViaCache: 'none' })
        .catch(function (error) {
          console.error('Service Worker 註冊失敗：', error);
        });
    });
  }
</script>
</body>
</html>
